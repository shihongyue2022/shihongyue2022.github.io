name: Deploy resume to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout PoE2 Build Atlas
        uses: actions/checkout@v4
        with:
          repository: shihongyue2022/PoE2-Build-Atlas
          ref: 1d4d420375a892eb7d0daa9ef647a12d318b80d4
          path: .workbench-source
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .workbench-source/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build hosted workbench
        working-directory: .workbench-source
        env:
          VITE_WORKBENCH_HOSTED: '1'
          VITE_WORKBENCH_BASE: /apps/poe2-companion/
        run: npm ci && npm run build
      - name: Build Astro site
        run: npm run build
      - name: Include the real workbench application
        run: node scripts/include-workbench.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
